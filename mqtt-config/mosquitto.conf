# ============================================================
#  Mosquitto MQTT Broker Configuration
#
#  Phase 1 — Local network (anonymous, port 1883)
#  Phase 2 — WAN / TLS    (authenticated, port 8883)
#
#  Topics used by this system:
#    dev/motor    → motor direction + speed commands  (GUI → Pi)
#    dev/led      → LED on / off / blink              (GUI → Pi)
#    dev/commands → servo, beep, stop commands        (GUI → Pi)
#    dev/status   → acknowledgements + fail-safe      (Pi → GUI)
#
#  Also supports the existing car/* topics used by the Node.js backend:
#    car/control  car/status  car/alert  car/audio  car/mic_audio  car/mode
# ============================================================


# ── Listener ──────────────────────────────────────────────────────────────────
# Phase 1: plain MQTT on port 1883 (local network only)
listener 1883
protocol mqtt

# Bind to all interfaces so both the Pi and laptop can reach this broker.
# Change to a specific IP (e.g. 192.168.1.100) to restrict access.
# bind_address 0.0.0.0


# ── WebSocket listener (optional — for browser direct MQTT) ───────────────────
# Uncomment if you want browsers to connect directly without the Node.js bridge.
# listener 9001
# protocol websockets


# ── Authentication ─────────────────────────────────────────────────────────────
# Phase 1 — allow anonymous connections (development / local network)
allow_anonymous true

# Phase 2 — disable anonymous and require username/password
# allow_anonymous false
# password_file /etc/mosquitto/passwd
#
# To create a password file:
#   sudo mosquitto_passwd -c /etc/mosquitto/passwd <username>


# ── Persistence ────────────────────────────────────────────────────────────────
# Retain messages across broker restarts (useful for car/status last-will)
persistence true
persistence_location /var/lib/mosquitto/


# ── Logging ────────────────────────────────────────────────────────────────────
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Also log to stdout for easy debugging during development
log_dest stdout


# ── Connection limits ──────────────────────────────────────────────────────────
max_connections 50
max_keepalive 120


# ── TLS — Phase 2 (WAN) ───────────────────────────────────────────────────────
# Uncomment and configure this section when deploying over the internet.
# Requires a valid certificate (e.g. from Let's Encrypt or a self-signed CA).
#
# listener 8883
# protocol mqtt
# allow_anonymous false
# password_file /etc/mosquitto/passwd
#
# cafile   /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile  /etc/mosquitto/certs/server.key
# tls_version tlsv1.2
#
# To generate a self-signed cert for testing:
#   openssl req -new -x509 -days 365 -extensions v3_ca \
#     -keyout ca.key -out ca.crt
#   openssl genrsa -out server.key 2048
#   openssl req -new -out server.csr -key server.key
#   openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key \
#     -CAcreateserial -out server.crt -days 365
