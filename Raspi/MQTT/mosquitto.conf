# Mosquitto MQTT Broker Configuration
# For Raspberry Pi Surveillance Car Project

# =============================================================================
# NETWORK SETTINGS
# =============================================================================

# Listen on all interfaces
listener 1883 0.0.0.0

# Protocol version
protocol mqtt

# =============================================================================
# PERSISTENCE
# =============================================================================

# Enable persistence
persistence true
persistence_location /var/lib/mosquitto/

# Persistence file
persistence_file mosquitto.db

# Autosave interval (seconds)
autosave_interval 300

# =============================================================================
# LOGGING
# =============================================================================

# Log destinations
log_dest file /var/log/mosquitto/mosquitto.log
log_dest stdout

# Log types
log_type error
log_type warning
log_type notice
log_type information

# Connection messages
connection_messages true

# Log timestamp
log_timestamp true

# =============================================================================
# SECURITY
# =============================================================================

# Allow anonymous connections (for development)
# For production, set to false and configure authentication
allow_anonymous true

# Password file (uncomment for production)
# password_file /etc/mosquitto/passwd

# ACL file (uncomment for production)
# acl_file /etc/mosquitto/acl

# =============================================================================
# PERFORMANCE
# =============================================================================

# Max queued messages per client
max_queued_messages 1000

# Max inflight messages
max_inflight_messages 20

# Max packet size (bytes)
message_size_limit 10485760

# =============================================================================
# KEEPALIVE
# =============================================================================

# Max keepalive (seconds)
max_keepalive 65535

# =============================================================================
# WEBSOCKET SUPPORT (Optional)
# =============================================================================

# Uncomment to enable WebSocket support on port 9001
# listener 9001
# protocol websockets

# =============================================================================
# BRIDGE (Optional - for cloud MQTT)
# =============================================================================

# Uncomment to bridge to cloud MQTT broker
# connection bridge-to-cloud
# address cloud.mqtt.broker:1883
# topic dev/# both 0
# bridge_attempt_unsubscribe true
# bridge_protocol_version mqttv311
